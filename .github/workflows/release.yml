name: Release

# Pushing a version tag (v0.2.0) builds the installer and drafts a GitHub release with it
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  app:
    name: App
    uses: ./.github/workflows/app.yml

  release:
    name: Windows installer
    needs: app
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and tags: the changelog lists the commits since the previous tag
          fetch-depth: 0

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in tauri.conf.json ($version)"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Release notes from the feat: and fix: commits since the previous tag
      - name: Write the changelog
        id: changelog
        shell: bash
        run: |
          bunx changelogithub --to "$GITHUB_REF_NAME" --output changelog.md
          {
            echo 'notes<<EOF'
            cat changelog.md
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Also uploads latest.json, which the app's updater reads once the release is published
      - name: Build the installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: Micropaste ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.changelog.outputs.notes }}

            Download `x64-setup.exe` below to install Micropaste.
          releaseDraft: true

      # Same app, with WebView2 inside the installer as the Store requires; replaces the installer above once uploaded
      - name: Bundle the Microsoft Store installer
        run: bun tauri bundle --bundles nsis --config src-tauri/tauri.microsoftstore.conf.json

      # The Store links to it: never overwritten, as the Store requires the file behind a link never changes
      - name: Upload the Microsoft Store installer to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          name="Micropaste_${version}_x64-setup.exe"
          if aws s3api head-object --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --key "$name" > /dev/null 2>&1; then
            echo "::error::$name is already in R2: the file behind a Store link must never change"
            exit 1
          fi
          aws s3 cp "src-tauri/target/release/bundle/nsis/$name" "s3://$R2_BUCKET/$name" \
            --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=31536000, immutable"
