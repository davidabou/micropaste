name: Release

# Pushing a version tag (v0.2.0) builds the installer and drafts a GitHub release with it
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  app:
    name: App
    uses: ./.github/workflows/app.yml

  release:
    name: Windows installer
    needs: app
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and tags: the changelog lists the commits since the previous tag
          fetch-depth: 0

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in tauri.conf.json ($version)"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Release notes from the feat: and fix: commits since the previous tag
      - name: Write the changelog
        id: changelog
        shell: bash
        run: |
          bunx changelogithub --to "$GITHUB_REF_NAME" --output changelog.md
          {
            echo 'notes<<EOF'
            cat changelog.md
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build the x64 installer
        id: x64
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: Micropaste ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.changelog.outputs.notes }}

            Download the installer below to install Micropaste: `x64-setup.exe` for most PCs, `arm64-setup.exe` for ARM PCs (Snapdragon).
          releaseDraft: true

      # Cross-compiled on the same runner, uploaded to the release drafted above
      - name: Build the ARM64 installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun tauri
          args: --target aarch64-pc-windows-msvc
          releaseId: ${{ steps.x64.outputs.releaseId }}
