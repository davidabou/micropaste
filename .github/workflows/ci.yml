name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the checks still running on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run generate

  rust:
    name: Rust
    # The app uses Windows APIs: checked on Windows only
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --check

      # Tauri embeds the frontend at compile time: an empty folder is enough to check the code
      - name: Stub the frontend build
        run: New-Item -ItemType Directory -Force ../.output/public

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
