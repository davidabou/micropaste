[package]
name = "Micropaste"
version = "0.1.1"
description = "Visual clipboard library for Windows 11"
authors = ["davidabou"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.1"
clipboard-master = { version = "4", default-features = false }
arboard = { version = "3", default-features = false, features = ["image-data"] }
rusqlite = { version = "0.40", features = ["bundled"] }
png = "0.18.1"
base64 = "0.23.1"
blake3 = "1.8.7"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2"] }
scraper = "0.27"
url = "2"
drag = "2.1.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tauri-plugin-global-shortcut = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
clipboard-win = "5.4"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }
